<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Track spending, filter by date/category, and visualize instantly.">
        <meta name="keywords" content="Track spending, filter spending, follow expenses, finance management">
        
        <!-- (Reset/ Normalize) -->
        <link rel="stylesheet" href="{{url_for('static', filename='css/normalize.css')}}">

        <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
        <title>{% block title %}Wallety{% endblock %}</title>


        <!-- bar charts js -->
         
         <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>

    <main class="container">

        {% block navbar %}

         <nav class="navigation" >
             <a href="{{url_for('index')}}"><img src="../static/logo-wally-white.svg" alt="wally-logo" width="55px"></a>
         <nav>  

        {% endblock %}

        <!-- handle flash messages with categories=True -->

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

            {% block body %}{% endblock %}
            
            <footer class="main-footer">
                Build with Flask, SQlite, Flask-login & vanilla html&css
            </footer>
            
        </main>
        <script>
  document.addEventListener("DOMContentLoaded", function() {
    // Select all flash message containers
    const flashMessages = document.querySelectorAll('.flash');
    const errorMessages = document.querySelectorAll('.errors');

    flashMessages.forEach(function(message) {
      setTimeout(function() {
        // Smoothly fade out the element
        message.style.transition = "opacity 0.5s ease";
        message.style.opacity = "0";
        
        // Remove from DOM after fade completes
        setTimeout(function() {
          message.remove();
        }, 500);
      }, 3000); // 5000ms = 5 seconds
    });
    errorMessages.forEach(function(message) {
      setTimeout(function() {
        // Smoothly fade out the element
        message.style.transition = "opacity 0.5s ease";
        message.style.opacity = "0";
        
        // Remove from DOM after fade completes
        setTimeout(function() {
          message.remove();
        }, 500);
      }, 4000); // 5000ms = 5 seconds
    });
  });
</script>
    </body>
</html>
