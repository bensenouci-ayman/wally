<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Track spending, filter by date/category, and visualize instantly.">
        <meta name="keywords" content="Track spending, filter spending, follow expenses, finance management">

        
        <!-- (Reset/ Normalize) -->
        <link rel="stylesheet" href="{{url_for('static', filename='css/normalize.css')}}">

        <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
        <title>{% block title %}Wallety{% endblock %}</title>
    </head>
    <body>

        <!-- handle flash messages with categories=True -->

        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
            <ul class="flash">
                {% for category, message in messages%}
                    <li class="{{category}}">{{message}}</li>
                {% endfor %}
            </ul>
            {% endif %}
        {% endwith %}


        <main>
            {% block body %}{% endblock %}
        </main>

        <footer class="main-footer">
            Build with Flask, SQlite, Flask-login & vanilla html&css
        </footer>

    </body>
</html>
