{% extends "layout.html" %} {% block title %}Home · Flask Auth Lite{% endblock %}
{% block body %}

<div class="container">
  <h1 class="page-title">Welcome</h1>
  <p class="page-subtitle">
    Track spending, filter by date/category, and visualize instantly.
  </p>
  
  <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
    <a
      class="rounded-2xl border border-slate-800 bg-slate-900 p-4 hover:bg-slate-800/50"
      href="/register"
    >
      <h2 class="card-title">Register</h2>
      <p class="text-sm text-slate-400">Create a new account</p>
    </a>
    <a
      class="rounded-2xl border border-slate-800 bg-slate-900 p-4 hover:bg-slate-800/50"
      href="/login"
    >
      <h2 class="card-title">Login</h2>
      <p class="text-sm text-slate-400">Access your dashboard</p>
    </a>
  </div>
</div>
{% endblock %}
