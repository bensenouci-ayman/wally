{% extends "layout.html" %}
{% block title %}Edit Expense · Expense Tracker{% endblock %}

{% block body %}
  <main class="container">

    <h1 class="page-title">Edit Expense</h1>
    <p class="page-subtitle">Update the fields and save your changes.</p>

    <section class="card card-narrow">

      <form method="post" action="{{url_for('edit_post', expense_id=expense.id)}}" class="add-form">

        <label class="field">
          <span class="field-label">Description</span>
          <input name="description"
                 value="{{ expense.description }}"
                 class="input" />
        </label>
        <div class="two-col">
          <label class="field">
            <span class="field-label">Amount</span>
            <input type="number" step="0.01" min="0.01" name="amount"
                   value="{{ '%.2f'|format(expense.amount) }}"
                   class="input" />
          </label>
          <label class="field">
            <span class="field-label">Date</span>
            <input type="date" name="date"
                   value="{{ expense.date.strftime('%Y-%m-%d') if expense.date else today }}"
                   class="input" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">Category</span>
          <select name="category"
                  class="input">
            {% for c in categories %}
              <option value="{{ c }}" {% if expense.category == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </label>
        <div class="button-row">
          <button class="btn btn-primary"
                  type="submit">Save Changes</button>
          <a class="btn btn-secondary"
             href="{{ url_for('index') }}">Cancel</a>
        </div>
      </form>
    </section>
  </main>
{% endblock %}
