{% extends "layout.html" %} 
{% block title %}Login · Flask Auth Lite{% endblock %}
{% block body %}
<section class="container">
  <div class="card card-narrow">
    <h1 class="page-title">Sign in</h1>
    <p class="page-subtitle">
      Enter your email and password to access your dashboard.
    </p>

    {% if errors %}
    <div>

        <ul style="list-style: none; line-height: 1.55; margin-bottom: 1rem;">
        {% for e in errors %}
          <li style="font-size: .875rem; color: #f1f5f9;">{{e}}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}

    <form class="add-form" method="post" action="{{url_for('login')}}" novalidate>
      <div class="field">
        <label for="email" class="field-label"
          >Email</label
        >
        <input
          id="email"
          name="email"
          type="email"
          required
          maxlength="120"
          class="input"
          placeholder="you@example.com"
        />
      </div>

      <div class="field">
        <label for="password" class="field-label"
          >Password</label
        >
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="6"
          class="input"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        style="margin-top: 1.125rem;"
      >
        Sign in
      </button>
    </form>

    <p style="margin-top: 1rem; font-size: .875rem;">
      Don’t have an account?
      <a href="/register" style="text-decoration: none; color: lightskyblue;" >Register</a>.
    </p>
  </div>
</section>
{% endblock %}
