{% extends "layout.html" %}
  {% block title %}Change Password · Flask Auth Lite{% endblock %}
{% block body %}

<section class="container">
  <div class="rounded-2xl border border-slate-800 bg-slate-900 p-6">
    <h1 class="page-title">Change Password</h1>
    <p class="page-subtitle">Update your account password securely.</p>

    {% if errors %}
      <div class="">
        <ul class="">
          {% for e in errors %}
            <li>{{ e }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <div class="card card-narrow">
      <form class="add-form" method="post" action="{{url_for('change_password')}}">
        <div class="field">
          <label for="current_password" class="field-label">Current Password</label>
          <input id="current_password" name="current_password" type="password" required
                 class="input"
                 placeholder="••••••••">
        </div>
        <div class="field">
          <label for="new_password" class="field-label">New Password</label>
          <input id="new_password" name="new_password" type="password" required minlength="6"
                 class="input"
                 placeholder="••••••••">
        </div>
        <div class="field">
          <label for="confirm_password" class="field-label">Confirm New Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
                 class="input"
                 placeholder="••••••••">
        </div>
        <button type="submit"
                class="btn btn-primary">
          Update Password
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
